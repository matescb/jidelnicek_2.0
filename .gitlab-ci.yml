# GitLab CI/CD Pipeline for Jídelníček 2.0
# Based on Documentation/jidelnicek_CI-CD Pipeline.md

stages:
  - build
  - test
  - quality
  - security
  - deploy

variables:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "15"
  REDIS_VERSION: "7"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"

# Cache configuration
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/pip
    - .cache/poetry
    - .venv/

# Build stage
build:
  stage: build
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y curl build-essential libpq-dev
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install --no-dev
  script:
    - echo "Dependencies installed successfully"
    - poetry run python -c "import fastapi; print('FastAPI version:', fastapi.__version__)"
  artifacts:
    paths:
      - .venv/
    expire_in: 1 hour

# Unit tests with coverage
unit-tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  services:
    - name: postgres:${POSTGRES_VERSION}-alpine
      alias: postgres
      variables:
        POSTGRES_DB: test_jidelnicek
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
    - name: redis:${REDIS_VERSION}-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql://test_user:test_password@postgres:5432/test_jidelnicek"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "test-secret-key-for-ci"
    TESTING: "true"
    ENVIRONMENT: "test"
    DB_PASSWORD: "test_password"
    SENTRY_DSN: "https://test@sentry.io/123456"
    CORS_ORIGINS: '["http://testserver"]'
  before_script:
    - apt-get update && apt-get install -y curl build-essential libpq-dev
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install --with dev
  script:
    # Wait for services to be ready
    - sleep 10
    # Run unit tests with coverage
    - poetry run pytest tests/ 
        --cov=src/jidelnicek 
        --cov-report=xml 
        --cov-report=html 
        --cov-report=term-missing 
        --cov-fail-under=70 
        -v 
        --tb=short 
        --maxfail=10
    # Nutritional accuracy tests (99.9% requirement)
    - poetry run pytest test_scaling_accuracy_standalone.py -v
    - poetry run pytest test_categorization_accuracy.py -v
    - poetry run pytest test_rounding_accuracy.py -v
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
      - coverage.xml
    expire_in: 1 week
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

# Integration tests
integration-tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  services:
    - name: postgres:${POSTGRES_VERSION}-alpine
      alias: postgres
      variables:
        POSTGRES_DB: test_jidelnicek
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
    - name: redis:${REDIS_VERSION}-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql://test_user:test_password@postgres:5432/test_jidelnicek"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "test-secret-key-for-ci"
    TESTING: "true"
    ENVIRONMENT: "test"
    DB_PASSWORD: "test_password"
    PERFORMANCE_THRESHOLD_MS: "200"
  before_script:
    - apt-get update && apt-get install -y curl build-essential libpq-dev
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install --with dev
  script:
    # Wait for services to be ready
    - sleep 10
    # Run database migrations
    - poetry run alembic upgrade head
    # Seed test data
    - poetry run python src/jidelnicek/core/seed_data.py
    # Run integration tests
    - poetry run pytest tests/auth/ tests/recipe/ tests/shopping/ tests/trip/ tests/core/
        -v 
        --tb=short 
        --maxfail=5
        -m "not unit"
  artifacts:
    reports:
      junit: integration-test-results.xml
    expire_in: 1 week

# Code quality checks
code-quality:
  stage: quality
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y curl build-essential libpq-dev
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install --with dev
  script:
    # Black formatting check
    - poetry run black --check --diff src/ tests/
    # Flake8 linting
    - poetry run flake8 src/ tests/ --max-line-length=100
    # MyPy type checking
    - poetry run mypy src/jidelnicek --config-file=pyproject.toml
  allow_failure: false

# Security scanning
security-scan:
  stage: security
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update && apt-get install -y curl build-essential libpq-dev
    - pip install poetry bandit safety
    - poetry config virtualenvs.in-project true
    - poetry install --with dev
  script:
    # Bandit security linter
    - bandit -r src/ -ll || echo "Bandit found security issues"
    # Safety check for dependencies
    - poetry run safety check || echo "Safety found vulnerable dependencies"
  allow_failure: true
  artifacts:
    reports:
      sast: bandit-report.json
    expire_in: 1 week

# Docker build
docker-build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - docker info
  script:
    # Build application image
    - docker build -t jidelnicek:latest -f docker/Dockerfile .
    # Tag with commit SHA
    - docker tag jidelnicek:latest jidelnicek:$CI_COMMIT_SHA
    # Save images for deployment
    - docker save jidelnicek:latest jidelnicek:$CI_COMMIT_SHA | gzip > jidelnicek-images.tar.gz
  artifacts:
    paths:
      - jidelnicek-images.tar.gz
    expire_in: 1 day
  only:
    - main

# Performance tests
performance-tests:
  stage: test
  image: python:${PYTHON_VERSION}-slim
  services:
    - name: postgres:${POSTGRES_VERSION}-alpine
      alias: postgres
      variables:
        POSTGRES_DB: test_jidelnicek
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
    - name: redis:${REDIS_VERSION}-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql://test_user:test_password@postgres:5432/test_jidelnicek"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "test-secret-key-for-ci"
    TESTING: "true"
    ENVIRONMENT: "test"
    PERFORMANCE_THRESHOLD_MS: "200"
  before_script:
    - apt-get update && apt-get install -y curl build-essential libpq-dev
    - pip install poetry
    - poetry config virtualenvs.in-project true
    - poetry install --with dev
  script:
    # Wait for services
    - sleep 10
    # Run database migrations
    - poetry run alembic upgrade head
    # Performance tests - API response time <200ms
    - poetry run pytest tests/core/test_database_performance.py -v
    # Test scaling accuracy and performance
    - poetry run python test_scaling_accuracy_standalone_fixed.py
  allow_failure: false
  only:
    - main

# Deploy to production (manual)
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client curl
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    # Copy Docker images to VPS
    - scp jidelnicek-images.tar.gz $VPS_USER@$VPS_HOST:/tmp/
    # Copy docker-compose configuration
    - scp docker-compose.yml $VPS_USER@$VPS_HOST:/opt/jidelnicek/
    # Deploy on VPS
    - ssh $VPS_USER@$VPS_HOST "
        cd /tmp &&
        gunzip -c jidelnicek-images.tar.gz | docker load &&
        rm jidelnicek-images.tar.gz &&
        cd /opt/jidelnicek &&
        docker-compose ps > deployment-backup-$(date +%Y%m%d-%H%M%S).log &&
        docker-compose down &&
        docker-compose run --rm app alembic upgrade head &&
        docker-compose up -d &&
        docker image prune -f
      "
    # Health check
    - sleep 30
    - |
      for i in {1..10}; do
        if curl -f https://$VPS_HOST/health; then
          echo "Health check passed"
          break
        fi
        echo "Waiting for service... (attempt $i/10)"
        sleep 10
      done
  dependencies:
    - docker-build
  only:
    - main
  when: manual
  environment:
    name: production
    url: https://$VPS_HOST

# Rollback job (manual)
rollback-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk update && apk add openssh-client curl
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts
  script:
    - ssh $VPS_USER@$VPS_HOST "
        cd /opt/jidelnicek &&
        docker-compose down &&
        docker tag jidelnicek:previous jidelnicek:latest &&
        docker-compose up -d &&
        echo 'Rollback completed'
      "
    # Health check after rollback
    - sleep 30
    - curl -f https://$VPS_HOST/health
  only:
    - main
  when: manual
  environment:
    name: production
    url: https://$VPS_HOST