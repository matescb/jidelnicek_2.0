# -*- coding: utf-8 -*-
openapi: 3.0.3
info:
  title: Jídelníček API
  description: 'API for the Jídelníček meal planning application designed for outdoor
    enthusiasts and expedition leaders.


    ## Authentication

    All endpoints except authentication and public recipe viewing require a valid
    JWT token.

    Include the token in the Authorization header: `Authorization: Bearer <token>`


    ## Rate Limiting

    - Authenticated requests: 1000/hour per user

    - Unauthenticated requests: 100/hour per IP

    - Export operations: 10/hour per user


    ## Units and Localization

    - All weights are stored internally in grams

    - All energy values are stored internally in calories

    - Unit conversion happens at the presentation layer based on user preferences

    - Supported languages: English (en), Czech (cs)

    '
  version: 1.0.0
  contact:
    name: Jídelníček Support
    email: support@jidelnicek.cz
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8000/api/v1
    description: Development server
  - url: https://api.jidelnicek.cz/api/v1
    description: Production server
paths:
  /users/me:
    get:
      tags:
      - Users
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Users
      summary: Update user profile
      description: Update user preferences and settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me/stats:
    get:
      tags:
      - Users
      summary: Get user statistics
      description: Get usage statistics for the current user
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint
  parameters:
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    offsetParam:
      name: offset
      in: query
      description: Number of items to skip
      schema:
        type: integer
        minimum: 0
        default: 0
    recipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Recipe ID
    ingredientId:
      name: ingredientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Ingredient ID
    snackId:
      name: snackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Snack ID
    tripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Trip ID
    dayId:
      name: dayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Day ID
    participantId:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Participant ID
  responses:
    BadRequest:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid input
            message: The provided data does not meet the required format
            details:
            - field: email
              issue: Invalid email format
    Unauthorized:
      description: Unauthorized - invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: Invalid or expired authentication token
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
            message: You do not have permission to access this resource
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not Found
            message: The requested resource was not found
    TooManyRequests:
      description: Too many requests - rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Too Many Requests
            message: Rate limit exceeded. Please try again later.
  schemas:
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          description: Additional error details
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string
    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        limit:
          type: integer
          description: Items per page
        offset:
          type: integer
          description: Current offset
        has_more:
          type: boolean
          description: Whether more items exist
    UserRegister:
      type: object
      required:
      - email
      - password
      - confirm_password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must contain at least 12 characters, including uppercase, lowercase,
            number, and special character. Cannot contain sequential patterns like
            'abc' or '123'
        confirm_password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must match the password field
        language:
          type: string
          enum:
          - en
          - cs
          default: cs
        unit_system:
          type: string
          enum:
          - metric
          - imperial
          default: metric
        energy_unit:
          type: string
          enum:
          - kcal
          - kJ
          default: kcal
        has_pku:
          type: boolean
          default: false
          description: Whether the user has phenylketonuria (PKU)
    UserLogin:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Access token expiration time in seconds
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        is_active:
          type: boolean
        email_verified:
          type: boolean
        role:
          type: string
        language:
          type: string
        unit_system:
          type: string
        energy_unit:
          type: string
        timezone:
          type: string
        has_pku:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
          nullable: true
        recipe_count:
          type: integer
        trip_count:
          type: integer
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        language:
          type: string
          maxLength: 2
        unit_system:
          type: string
          maxLength: 10
        energy_unit:
          type: string
          maxLength: 10
        timezone:
          type: string
          maxLength: 50
    UserStats:
      type: object
      properties:
        total_recipes_created:
          type: integer
        total_trips_created:
          type: integer
        total_trips_participated:
          type: integer
        favorite_recipes_count:
          type: integer
        recent_activity_count:
          type: integer
        joined_days_ago:
          type: integer
  responses:
    BadRequest:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Invalid input
            message: The provided data does not meet the required format
    Unauthorized:
      description: Unauthorized - invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: Invalid or expired authentication token
    ValidationError:
      description: Validation error - invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation Error
            message: Request validation failed
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal Server Error
            message: An unexpected error occurred
