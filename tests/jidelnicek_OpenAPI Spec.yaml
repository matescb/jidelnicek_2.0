# Jídelníček REST API v1.0
# This is the primary and complete API for the application
# Note: This REST API provides complete functionality for all application features.
# GraphQL evaluation is planned post-launch based on REST API usage patterns and performance requirements.

openapi: 3.0.3
info:
  title: Jídelníček API
  description: |
    API for the Jídelníček meal planning application designed for outdoor enthusiasts and expedition leaders.
    
    ## Authentication
    All endpoints except authentication and public recipe viewing require a valid JWT token.
    Include the token in the Authorization header: `Authorization: Bearer <token>`
    
    ## Rate Limiting
    - Authenticated requests: 1000/hour per user
    - Unauthenticated requests: 100/hour per IP
    - Export operations: 10/hour per user
    
    ## Units and Localization
    - All weights are stored internally in grams
    - All energy values are stored internally in calories
    - Unit conversion happens at the presentation layer based on user preferences
    - Supported languages: English (en), Czech (cs)
  version: 1.0.0
  contact:
    name: Jídelníček Support
    email: support@jidelnicek.cz
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.jidelnicek.cz/api/v1
    description: Production server
  - url: https://staging-api.jidelnicek.cz/api/v1
    description: Staging server
  - url: http://localhost:8000/api/v1
    description: Development server

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: User authentication and account management
  - name: Users
    description: User profile and preferences
  - name: Recipes
    description: Recipe creation and management
  - name: Ingredients
    description: Ingredient database management
  - name: Snacks
    description: Snack management
  - name: Trips
    description: Trip planning and organization
  - name: Meals
    description: Meal assignment and management
  - name: Calculations
    description: Nutritional and fuel calculations
  - name: Marketplace
    description: Public recipe marketplace
  - name: Exports
    description: Export and report generation
  - name: Templates
    description: Trip and day templates
  - name: Sharing
    description: Recipe and trip sharing

paths:
  # Authentication endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
            example:
              email: "user@example.com"
              password: "SecurePassword123!"
              confirm_password: "SecurePassword123!"
              language: "en"
              unit_system: "metric"
              energy_unit: "kcal"
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive access tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
            example:
              email: "user@example.com"
              password: "SecurePassword123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many failed login attempts
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry allowed

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Use refresh token to get new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  description: Valid refresh token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate current session
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email address
      description: Verify user email with token from email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Verification token from email
      responses:
        '200':
          description: Email verified successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent if user exists
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/reset-password/confirm:
    post:
      tags:
        - Authentication
      summary: Confirm password reset
      description: Set new password with reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
        '400':
          $ref: '#/components/responses/BadRequest'

  # User endpoints
  /users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Users
      summary: Update user profile
      description: Update user preferences and settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/stats:
    get:
      tags:
        - Users
      summary: Get user statistics
      description: Get usage statistics for the current user
      responses:
        '200':
          description: Statistics retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Recipe endpoints
  /recipes:
    get:
      tags:
        - Recipes
      summary: List user's recipes
      description: Retrieve all recipes created by the authenticated user
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: search
          in: query
          description: Search term for recipe names
          schema:
            type: string
        - name: sort
          in: query
          description: Sort field
          schema:
            type: string
            enum: [created_at, updated_at, name]
            default: updated_at
        - name: order
          in: query
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: List of recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Recipes
      summary: Create new recipe
      description: Create a new recipe with ingredients and nutritional calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeCreate'
            example:
              name: "Trail Mix Energy Bars"
              description: "High-energy bars perfect for hiking"
              instructions: "Mix all ingredients, press into pan, bake at 180°C for 20 minutes"
              prep_time_minutes: 15
              cook_time_minutes: 20
              water_ml: 0
              servings: 8
              ingredients:
                - ingredient_id: "123e4567-e89b-12d3-a456-426614174000"
                  quantity_g: 200
                - ingredient_id: "223e4567-e89b-12d3-a456-426614174000"
                  quantity_g: 150
      responses:
        '201':
          description: Recipe created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recipe limit reached (500 recipes per user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /recipes/{recipeId}:
    get:
      tags:
        - Recipes
      summary: Get recipe details
      description: Retrieve a specific recipe with full details
      parameters:
        - $ref: '#/components/parameters/recipeId'
        - name: version
          in: query
          description: Specific version number to retrieve
          schema:
            type: integer
      responses:
        '200':
          description: Recipe details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Recipes
      summary: Update recipe
      description: Update an existing recipe. Creates new version if nutritional changes >1%
      parameters:
        - $ref: '#/components/parameters/recipeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeUpdate'
      responses:
        '200':
          description: Recipe updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Recipes
      summary: Delete recipe
      description: Delete a recipe. Cannot delete if used in active trips or forked >5 times
      parameters:
        - $ref: '#/components/parameters/recipeId'
      responses:
        '204':
          description: Recipe deleted successfully
        '400':
          description: Cannot delete recipe (in use or heavily forked)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/{recipeId}/duplicate:
    post:
      tags:
        - Recipes
      summary: Duplicate recipe
      description: Create a copy of an existing recipe
      parameters:
        - $ref: '#/components/parameters/recipeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name for duplicated recipe
      responses:
        '201':
          description: Recipe duplicated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recipe limit reached
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/{recipeId}/versions:
    get:
      tags:
        - Recipes
      summary: Get recipe version history
      description: Retrieve version history for a recipe (last 10 versions)
      parameters:
        - $ref: '#/components/parameters/recipeId'
      responses:
        '200':
          description: Recipe version history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/{recipeId}/versions/{versionId}/restore:
    post:
      tags:
        - Recipes
      summary: Restore recipe version
      description: Restore a previous version of a recipe
      parameters:
        - $ref: '#/components/parameters/recipeId'
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Recipe version restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/{recipeId}/images:
    post:
      tags:
        - Recipes
      summary: Upload recipe image
      description: Upload an image for a recipe (max 5MB, max 10 images per recipe)
      parameters:
        - $ref: '#/components/parameters/recipeId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file (JPEG, PNG, WebP)
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeImage'
        '400':
          description: Invalid image or limit reached
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/{recipeId}/images/{imageId}:
    delete:
      tags:
        - Recipes
      summary: Delete recipe image
      description: Remove an image from a recipe
      parameters:
        - $ref: '#/components/parameters/recipeId'
        - name: imageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Image deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/{recipeId}/publish:
    post:
      tags:
        - Recipes
      summary: Publish recipe to marketplace
      description: Make a recipe publicly available in the marketplace
      parameters:
        - $ref: '#/components/parameters/recipeId'
      responses:
        '200':
          description: Recipe published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/{recipeId}/unpublish:
    post:
      tags:
        - Recipes
      summary: Unpublish recipe from marketplace
      description: Remove a recipe from public marketplace (not allowed if forked >5 times)
      parameters:
        - $ref: '#/components/parameters/recipeId'
      responses:
        '200':
          description: Recipe unpublished successfully
        '400':
          description: Cannot unpublish (too many forks)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /recipes/search:
    get:
      tags:
        - Recipes
      summary: Search recipes
      description: Advanced search for recipes with filters
      parameters:
        - name: q
          in: query
          description: Search query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [breakfast, lunch, dinner, snack]
        - name: dietary
          in: query
          schema:
            type: array
            items:
              type: string
        - name: min_calories
          in: query
          schema:
            type: integer
        - name: max_calories
          in: query
          schema:
            type: integer
        - name: max_time
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Ingredient endpoints
  /ingredients:
    get:
      tags:
        - Ingredients
      summary: List ingredients
      description: Get user's personal ingredients and global ingredients
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: search
          in: query
          description: Search term for ingredient names
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: scope
          in: query
          description: Filter by scope
          schema:
            type: string
            enum: [personal, global, all]
            default: all
      responses:
        '200':
          description: List of ingredients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Ingredients
      summary: Create personal ingredient
      description: Add a new ingredient to user's personal database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientCreate'
            example:
              name: "Chia Seeds"
              category: "Grains & Seeds"
              nutritional_values:
                calories: 486
                proteins_g: 16.5
                carbohydrates_g: 42.1
                fats_g: 30.7
                fiber_g: 34.4
                calcium_mg: 631
      responses:
        '201':
          description: Ingredient created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Ingredient with this name already exists

  /ingredients/global:
    get:
      tags:
        - Ingredients
      summary: List global ingredients
      description: Get the fixed list of common global ingredients
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of global ingredients
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientList'

  /ingredients/{ingredientId}:
    get:
      tags:
        - Ingredients
      summary: Get ingredient details
      description: Retrieve specific ingredient information
      parameters:
        - $ref: '#/components/parameters/ingredientId'
      responses:
        '200':
          description: Ingredient details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Ingredients
      summary: Update personal ingredient
      description: Update a personal ingredient (cannot update global ingredients)
      parameters:
        - $ref: '#/components/parameters/ingredientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngredientUpdate'
      responses:
        '200':
          description: Ingredient updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot modify global ingredients
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Ingredients
      summary: Delete personal ingredient
      description: Remove a personal ingredient (cannot delete if used in recipes)
      parameters:
        - $ref: '#/components/parameters/ingredientId'
      responses:
        '204':
          description: Ingredient deleted successfully
        '400':
          description: Cannot delete ingredient in use
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot delete global ingredients
        '404':
          $ref: '#/components/responses/NotFound'

  /ingredients/categories:
    get:
      tags:
        - Ingredients
      summary: List ingredient categories
      description: Get available ingredient categories for shopping list grouping
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example:
                  - "Dairy"
                  - "Meat & Fish"
                  - "Vegetables"
                  - "Fruits"
                  - "Grains & Seeds"
                  - "Nuts"
                  - "Spices & Herbs"
                  - "Oils & Fats"
                  - "Beverages"
                  - "Other"

  # Snack endpoints
  /snacks:
    get:
      tags:
        - Snacks
      summary: List snacks
      description: Get user's personal snacks and global snacks
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: search
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
            enum: [personal, global, all]
            default: all
      responses:
        '200':
          description: List of snacks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnackList'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Snacks
      summary: Create personal snack
      description: Add a new snack to user's personal database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnackCreate'
            example:
              name: "Protein Bar"
              measurement_type: "piece"
              piece_weight_g: 65
              nutritional_values:
                calories: 280
                proteins_g: 20
                carbohydrates_g: 30
                fats_g: 9
      responses:
        '201':
          description: Snack created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /snacks/{snackId}:
    get:
      tags:
        - Snacks
      summary: Get snack details
      parameters:
        - $ref: '#/components/parameters/snackId'
      responses:
        '200':
          description: Snack details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Snacks
      summary: Update personal snack
      parameters:
        - $ref: '#/components/parameters/snackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnackUpdate'
      responses:
        '200':
          description: Snack updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snack'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot modify global snacks
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Snacks
      summary: Delete personal snack
      parameters:
        - $ref: '#/components/parameters/snackId'
      responses:
        '204':
          description: Snack deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot delete global snacks
        '404':
          $ref: '#/components/responses/NotFound'

  # Trip endpoints
  /trips:
    get:
      tags:
        - Trips
      summary: List user's trips
      description: Retrieve all trips created by the authenticated user
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
