      description: Get list of trending recipes based on recent activity
      security: []
      parameters:
        - name: period
          in: query
          description: Time period for trending calculation
          schema:
            type: string
            enum: [day, week, month]
            default: week
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: List of trending recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketplaceRecipe'

  # Export endpoints
  /trips/{tripId}/export/summary:
    get:
      tags:
        - Exports
      summary: Export trip summary
      description: Generate comprehensive trip summary with all details
      parameters:
        - $ref: '#/components/parameters/tripId'
        - name: format
          in: query
          description: Export format
          schema:
            type: string
            enum: [pdf, excel, txt]
            default: pdf
        - name: sections
          in: query
          description: Comma-separated list of sections to include
          schema:
            type: string
            example: "meals,nutrition,fuel,weight,shopping,packing"
      responses:
        '200':
          description: Export file generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Export rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer

  /trips/{tripId}/export/shopping-list:
    get:
      tags:
        - Exports
      summary: Export shopping list
      description: Generate consolidated shopping list grouped by category
      parameters:
        - $ref: '#/components/parameters/tripId'
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, excel, txt]
            default: pdf
      responses:
        '200':
          description: Shopping list generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/export/packing-list:
    get:
      tags:
        - Exports
      summary: Export packing list
      description: Generate packing list for trip organization
      parameters:
        - $ref: '#/components/parameters/tripId'
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, excel, txt]
            default: pdf
        - name: type
          in: query
          description: Type of packing list
          schema:
            type: string
            enum: [total, daily]
            default: total
      responses:
        '200':
          description: Packing list generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/export/nutrition:
    get:
      tags:
        - Exports
      summary: Export nutrition report
      description: Generate detailed nutritional analysis report
      parameters:
        - $ref: '#/components/parameters/tripId'
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, excel]
            default: pdf
        - name: detail_level
          in: query
          description: Level of nutritional detail
          schema:
            type: string
            enum: [summary, daily, meal]
            default: daily
      responses:
        '200':
          description: Nutrition report generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Template endpoints
  /templates:
    get:
      tags:
        - Templates
      summary: List user's templates
      description: Get all trip and day templates
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: type
          in: query
          description: Filter by template type
          schema:
            type: string
            enum: [trip, day]
      responses:
        '200':
          description: List of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /templates/from-trip/{tripId}:
    post:
      tags:
        - Templates
      summary: Create template from trip
      description: Save entire trip as reusable template
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /templates/from-day/{tripId}/{dayId}:
    post:
      tags:
        - Templates
      summary: Create template from day
      description: Save single day as reusable template
      parameters:
        - $ref: '#/components/parameters/tripId'
        - $ref: '#/components/parameters/dayId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Template created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /templates/{templateId}:
    get:
      tags:
        - Templates
      summary: Get template details
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateDetailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Templates
      summary: Update template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Template updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Templates
      summary: Delete template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Template deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{tripId}/apply-template/{templateId}:
    post:
      tags:
        - Templates
      summary: Apply template to trip
      description: Apply a template's structure and content to an existing trip
      parameters:
        - $ref: '#/components/parameters/tripId'
        - name: templateId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start_day:
                  type: integer
                  description: Day number to start applying template from
                  minimum: 1
      responses:
        '200':
          description: Template applied successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # Sharing endpoints
  /share/recipe/{recipeId}:
    post:
      tags:
        - Sharing
      summary: Create recipe share link
      description: Generate a shareable link for a recipe
      parameters:
        - $ref: '#/components/parameters/recipeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: Days until link expires (null for no expiration)
                  minimum: 1
                  maximum: 365
      responses:
        '201':
          description: Share link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /share/trip/{tripId}:
    post:
      tags:
        - Sharing
      summary: Create trip share link
      description: Generate a shareable link for a trip
      parameters:
        - $ref: '#/components/parameters/tripId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days:
                  type: integer
                  description: Days until link expires (null for no expiration)
                  minimum: 1
                  maximum: 365
      responses:
        '201':
          description: Share link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /share/{shareToken}:
    get:
      tags:
        - Sharing
      summary: View shared content
      description: Access shared recipe or trip via share token
      security: []
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Shared content retrieved
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SharedRecipe'
                  - $ref: '#/components/schemas/SharedTrip'
        '404':
          description: Share link not found or expired
        '410':
          description: Share link expired

    delete:
      tags:
        - Sharing
      summary: Revoke share link
      description: Invalidate a share link
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Share link revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  parameters:
    limitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    
    offsetParam:
      name: offset
      in: query
      description: Number of items to skip
      schema:
        type: integer
        minimum: 0
        default: 0
    
    recipeId:
      name: recipeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Recipe ID
    
    ingredientId:
      name: ingredientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Ingredient ID
    
    snackId:
      name: snackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Snack ID
    
    tripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Trip ID
    
    dayId:
      name: dayId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Day ID
    
    participantId:
      name: participantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Participant ID

  responses:
    BadRequest:
      description: Bad request - invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid input"
            message: "The provided data does not meet the required format"
            details:
              - field: "email"
                issue: "Invalid email format"
    
    Unauthorized:
      description: Unauthorized - invalid or missing authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized"
            message: "Invalid or expired authentication token"
    
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Forbidden"
            message: "You do not have permission to access this resource"
    
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Not Found"
            message: "The requested resource was not found"
    
    TooManyRequests:
      description: Too many requests - rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Too Many Requests"
            message: "Rate limit exceeded. Please try again later."

  schemas:
    # Common schemas
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          description: Additional error details
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string

    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        limit:
          type: integer
          description: Items per page
        offset:
          type: integer
          description: Current offset
        has_more:
          type: boolean
          description: Whether more items exist

    # Authentication schemas
    UserRegister:
      type: object
      required:
        - email
        - password
        - confirm_password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must contain at least 12 characters, including uppercase, lowercase, number, and special character. Cannot contain sequential patterns like 'abc' or '123'
        confirm_password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must match the password field
        language:
          type: string
          enum: [en, cs]
          default: cs
        unit_system:
          type: string
          enum: [metric, imperial]
          default: metric
        energy_unit:
          type: string
          enum: [kcal, kJ]
          default: kcal
        has_pku:
          type: boolean
          default: false
          description: Whether the user has phenylketonuria (PKU)

    UserLogin:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        token_type:
          type: string
          default: Bearer
        expires_in:
          type: integer
          description: Access token expiration time in seconds

    # User schemas
    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        role:
          type: string
          enum: [user, admin]
        preferences:
          $ref: '#/components/schemas/UserPreferences'
        created_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time
        recipe_count:
          type: integer
        trip_count:
          type: integer

    UserPreferences:
      type: object
      properties:
        language:
          type: string
          enum: [en, cs]
        unit_system:
          type: string
          enum: [metric, imperial]
        energy_unit:
          type: string
          enum: [kcal, kJ]

    UserStats:
      type: object
      properties:
        total_recipes:
          type: integer
        public_recipes:
          type: integer
        total_trips:
          type: integer
        active_trips:
          type: integer
        total_ingredients:
          type: integer
        total_snacks:
          type: integer
        storage_used_mb:
          type: number

    # Nutritional schemas
    NutritionalValues:
      type: object
      required:
        - calories
        - proteins_g
        - carbohydrates_g
        - fats_g
      properties:
        calories:
          type: number
          minimum: 0
          description: Energy in calories (kcal)
        proteins_g:
          type: number
          minimum: 0
          description: Proteins in grams
        carbohydrates_g:
          type: number
          minimum: 0
          description: Total carbohydrates in grams
        fats_g:
          type: number
          minimum: 0
          description: Total fats in grams
        # Optional detailed breakdown
        sugars_g:
          type: number
          minimum: 0
          description: Sugars (subset of carbohydrates)
        saturated_fats_g:
          type: number
          minimum: 0
        trans_fats_g:
          type: number
          minimum: 0
        monounsaturated_fats_g:
          type: number
          minimum: 0
        polyunsaturated_fats_g:
          type: number
          minimum: 0
        cholesterol_mg:
          type: number
          minimum: 0
        fiber_g:
          type: number
          minimum: 0
        salt_g:
          type: number
          minimum: 0
        calcium_mg:
          type: number
          minimum: 0
        sodium_mg:
          type: number
          minimum: 0
        water_g:
          type: number
          minimum: 0
        phe_mg:
          type: number
          minimum: 0
          description: Phenylalanine for PKU tracking
        # Vitamins
        vitamin_a_ug:
          type: number
          minimum: 0
        vitamin_b1_mg:
          type: number
          minimum: 0
        vitamin_b2_mg:
          type: number
          minimum: 0
        vitamin_b3_mg:
          type: number
          minimum: 0
        vitamin_b5_mg:
          type: number
          minimum: 0
        vitamin_b6_mg:
          type: number
          minimum: 0
        vitamin_b7_ug:
          type: number
          minimum: 0
        vitamin_b9_ug:
          type: number
          minimum: 0
        vitamin_b12_ug:
          type: number
          minimum: 0
        vitamin_c_mg:
          type: number
          minimum: 0
        vitamin_d_ug:
          type: number
          minimum: 0
        vitamin_e_mg:
          type: number
          minimum: 0
        vitamin_k_ug:
          type: number
          minimum: 0

    # Recipe schemas
    RecipeIngredientInput:
      type: object
      required:
        - ingredient_id
        - quantity_g
      properties:
        ingredient_id:
          type: string
          format: uuid
        quantity_g:
          type: number
          minimum: 0.1
          maximum: 10000
          description: Quantity in grams

    RecipeIngredient:
      allOf:
        - $ref: '#/components/schemas/RecipeIngredientInput'
        - type: object
          properties:
            ingredient:
              $ref: '#/components/schemas/Ingredient'

    RecipeCreate:
      type: object
      required:
        - name
        - ingredients
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        instructions:
          type: string
          maxLength: 2000
        prep_time_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        cook_time_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: Time on stove
        water_ml:
          type: integer
          minimum: 0
          description: Cooking water required
          default: 0
        servings:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
        ingredients:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RecipeIngredientInput'

    RecipeUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        instructions:
          type: string
          maxLength: 2000
        prep_time_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        cook_time_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        water_ml:
          type: integer
          minimum: 0
        servings:
          type: integer
          minimum: 1
          maximum: 100
        ingredients:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/RecipeIngredientInput'

    Recipe:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        prep_time_minutes:
          type: integer
        cook_time_minutes:
          type: integer
        water_ml:
          type: integer
        servings:
          type: integer
        is_public:
          type: boolean
        published_at:
          type: string
          format: date-time
        fork_count:
          type: integer
        forked_from_id:
          type: string
          format: uuid
        can_unpublish:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current_version_id:
          type: string
          format: uuid
        version_number:
          type: integer
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        nutrition:
          $ref: '#/components/schemas/NutritionalValues'
        images:
          type: array
          items:
            $ref: '#/components/schemas/RecipeImage'
        author:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    RecipeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipe'
        pagination:
          $ref: '#/components/schemas/Pagination'

    RecipeVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipe_id:
          type: string
          format: uuid
        version_number:
          type: integer
        name:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        change_type:
          type: string
          enum: [major, minor]
          description: Major if nutrition changed >1%, minor for text only

    RecipeImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri
        file_size_bytes:
          type: integer
        uploaded_at:
          type: string
          format: date-time

    # Ingredient schemas
    IngredientCreate:
      type: object
      required:
        - name
        - nutritional_values
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          maxLength: 50
        nutritional_values:
          $ref: '#/components/schemas/NutritionalValues'

    IngredientUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          type: string
          maxLength: 50
        nutritional_values:
          $ref: '#/components/schemas/NutritionalValues'

    Ingredient:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
          description: Null for global ingredients
        name:
          type: string
        category:
          type: string
        is_global:
          type: boolean
        nutritional_values:
          $ref: '#/components/schemas/NutritionalValues'
        created_at:
          type: string
          format: date-time

    IngredientList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ingredient'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # Snack schemas
    SnackCreate:
      type: object
      required:
        - name
        - measurement_type
        - nutritional_values
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        measurement_type:
          type: string
          enum: [piece, per_100g]
        piece_weight_g:
          type: number
          minimum: 0.1
          description: Required if measurement_type is 'piece'
        nutritional_values:
          $ref: '#/components/schemas/NutritionalValues'

    SnackUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        measurement_type:
          type: string
          enum: [piece, per_100g]
        piece_weight_g:
          type: number
          minimum: 0.1
        nutritional_values:
          $ref: '#/components/schemas/NutritionalValues'

    Snack:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        measurement_type:
          type: string
          enum: [piece, per_100g]
        piece_weight_g:
          type: number
        is_global:
          type: boolean
        nutritional_values:
          $ref: '#/components/schemas/NutritionalValues'
        created_at:
          type: string
          format: date-time

    SnackList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Snack'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # Trip schemas
    ParticipantCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        number:
          type: integer
          minimum: 1
        coefficient:
          type: number
          minimum: 0.1
          maximum: 500
          default: 100
          description: Percentage (100 = 100%)

    ParticipantUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        coefficient:
          type: number
          minimum: 0.1
          maximum: 500

    Participant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        number:
          type: integer
        coefficient:
          type: number

    StoveConfig:
      type: object
      required:
        - efficiency_g_per_liter
      properties:
        name:
          type: string
          maxLength: 100
        efficiency_g_per_liter:
          type: number
          minimum: 0.1
          description: Grams of fuel per liter of boiling water
        altitude_adjustment_percent:
          type: number
          minimum: 0
          maximum: 100
          default: 0
          description: Additional fuel percentage for altitude

    Stove:
      allOf:
        - $ref: '#/components/schemas/StoveConfig'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            trip_id:
              type: string
              format: uuid

    TripCreate:
      type: object
      required:
        - name
        - start_date
        - end_date
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        meal_slots:
          type: array
          items:
            type: string
            maxLength: 50
          default: ["Breakfast", "Lunch", "Dinner"]
        track_recipe_changes:
          type: boolean
          default: false
          description: Track live recipe changes instead of snapshots
        participants:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ParticipantCreate'

    TripUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        meal_slots:
          type: array
          items:
            type: string
            maxLength: 50
        track_recipe_changes:
          type: boolean

    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        meal_slots:
          type: array
          items:
            type: string
        track_recipe_changes:
          type: boolean
        participant_count:
          type: integer
        day_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TripList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Trip'
        pagination:
          $ref: '#/components/schemas/Pagination'

    TripDayCreate:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
        notes:
          type: string
          maxLength: 2000

    TripDayUpdate:
      type: object
      properties:
        date:
          type: string
          format: date
        notes:
          type: string
          maxLength: 2000

    TripDay:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        day_number:
          type: integer
        date:
          type: string
          format: date
        notes:
          type: string
        meal_count:
          type: integer
        snack_count:
          type: integer
        drink_count:
          type: integer

    TripDayDetailed:
      allOf:
        - $ref: '#/components/schemas/TripDay'
        - type: object
          properties:
            meals:
              type: array
              items:
                $ref: '#/components/schemas/Meal'
            snacks:
              type: array
              items:
                $ref: '#/components/schemas/DaySnack'
            drinks:
              type: array
              items:
                $ref: '#/components/schemas/DayDrink'
            nutrition_summary:
              $ref: '#/components/schemas/NutritionalValues'

    TripDetailed:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          properties:
            participants:
              type: array
              items:
                $ref: '#/components/schemas/Participant'
            days:
              type: array
              items:
                $ref: '#/components/schemas/TripDayDetailed'
            stove:
              $ref: '#/components/schemas/Stove'
            summary:
              $ref: '#/components/schemas/TripSummary'

    TripSummary:
      type: object
      properties:
        total_nutrition:
          $ref: '#/components/schemas/NutritionalValues'
        daily_average_nutrition:
          $ref: '#/components/schemas/NutritionalValues'
        per_person_average_nutrition:
          $ref: '#/components/schemas/NutritionalValues'
        total_food_weight_g:
          type: number
        per_person_food_weight_g:
          type: number
        total_water_cooking_ml:
          type: integer
        total_cooking_time_minutes:
          type: integer
        fuel_calculation:
          type: object
          properties:
            base_fuel_g:
              type: number
            altitude_adjusted_fuel_g:
              type: number
            total_fuel_g:
              type: number
        meal_count:
          type: integer
        participant_count:
          type: integer
        day_count:
          type: integer

    # Meal schemas
    MealCreate:
      type: object
      required:
        - meal_slot
        - recipe_id
        - target_calories_per_person
      properties:
        meal_slot:
          type: string
          description: Must match one of the trip's configured meal slots
        recipe_id:
          type: string
          format: uuid
        target_calories_per_person:
          type: number
          minimum: 0
          description: Target calories per person for this meal

    MealUpdate:
      type: object
      properties:
        recipe_id:
          type: string
          format: uuid
        target_calories_per_person:
          type: number
          minimum: 0

    Meal:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_day_id:
          type: string
          format: uuid
        meal_slot:
          type: string
        recipe_snapshot_id:
          type: string
          format: uuid
        target_calories_per_person:
          type: number
        scaling_factor:
          type: number
          description: Factor applied to scale recipe to target calories
        rating:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: string

    MealDetailed:
      allOf:
        - $ref: '#/components/schemas/Meal'
        - type: object
          properties:
            recipe:
              $ref: '#/components/schemas/Recipe'
            scaled_ingredients:
              type: array
              items:
                type: object
                properties:
                  ingredient:
                    $ref: '#/components/schemas/Ingredient'
                  original_quantity_g:
                    type: number
                  scaled_quantity_g:
                    type: number
                  per_person_g:
                    type: number
            scaled_nutrition:
              $ref: '#/components/schemas/NutritionalValues'
            per_person_nutrition:
              $ref: '#/components/schemas/NutritionalValues'

    DaySnackCreate:
      type: object
      required:
        - snack_id
        - quantity_per_person
      properties:
        snack_id:
          type: string
          format: uuid
        quantity_per_person:
          type: number
          minimum: 0.1
          description: Number of pieces or grams per person

    DaySnackUpdate:
      type: object
      properties:
        quantity_per_person:
          type: number
          minimum: 0.1

    DaySnack:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_day_id:
          type: string
          format: uuid
        snack:
          $ref: '#/components/schemas/Snack'
        quantity_per_person:
          type: number
        total_quantity:
          type: number

    DayDrinkCreate:
      type: object
      required:
        - ingredient_id
        - quantity_per_person
      properties:
        ingredient_id:
          type: string
          format: uuid
        quantity_per_person:
          type: number
          minimum: 0.1
          description: Grams per person
        water_ml:
          type: integer
          minimum: 0
          description: Hot water required per person
          default: 0

    DayDrinkUpdate:
      type: object
      properties:
        quantity_per_person:
          type: number
          minimum: 0.1
        water_ml:
          type: integer
          minimum: 0

    DayDrink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_day_id:
          type: string
          format: uuid
        ingredient:
          $ref: '#/components/schemas/Ingredient'
        quantity_per_person:
          type: number
        total_quantity:
          type: number
        water_ml:
          type: integer

    # Marketplace schemas
    MarketplaceRecipe:
      allOf:
        - $ref: '#/components/schemas/Recipe'
        - type: object
          properties:
            average_rating:
              type: number
              minimum: 1
              maximum: 5
            rating_count:
              type: integer
            review_count:
              type: integer
            has_user_rating:
              type: boolean
            user_rating:
              type: integer
              minimum: 1
              maximum: 5
            forked_from:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                author_name:
                  type: string

    MarketplaceRecipeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MarketplaceRecipe'
        pagination:
          $ref: '#/components/schemas/Pagination'

    RecipeReview:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipe_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        review_text:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Template schemas
    Template:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_day_template:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TemplateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        pagination:
          $ref: '#/components/schemas/Pagination'

    TemplateDetailed:
      allOf:
        - $ref: '#/components/schemas/Template'
        - type: object
          properties:
            template_data:
              type: object
              description: JSON structure containing meal slots, recipes, snacks

    # Sharing schemas
    ShareLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [recipe, trip]
        entity_id:
          type: string
          format: uuid
        share_token:
          type: string
        share_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        view_count:
          type: integer

    SharedRecipe:
      type: object
      properties:
        type:
          type: string
          enum: [recipe]
        data:
          $ref: '#/components/schemas/Recipe'
        share_info:
          type: object
          properties:
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
            view_count:
              type: integer

    SharedTrip:
      type: object
      properties:
        type:
          type: string
          enum: [trip]
        data:
          $ref: '#/components/schemas/TripDetailed'
        share_info:
          type: object
          properties:
            created_by:
              type: string
            created_at:
              type: string
              format: date-time
            view_count:
              type: integer