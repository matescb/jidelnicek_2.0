services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: jidelnicek_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jidelnicek}
      POSTGRES_USER: ${DB_USER:-jidelnicek}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-${DB_PASSWORD}}
      READONLY_DB_PASSWORD: ${READONLY_DB_PASSWORD:-${APP_DB_PASSWORD:-${DB_PASSWORD}}}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/00_init_minimal.sh:/docker-entrypoint-initdb.d/00_init_minimal.sh:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jidelnicek} -d ${DB_NAME:-jidelnicek}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: jidelnicek_redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf
      --requirepass "$${REDIS_PASSWORD}"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jidelnicek_app
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"  # Expose API port for development
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-jidelnicek}:${DB_PASSWORD}@db:5432/${DB_NAME:-jidelnicek}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Application
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # Frontend Application (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jidelnicek_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - app
    networks:
      - backend
    stdin_open: true
    tty: true

  # Nginx Reverse Proxy (Production)
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jidelnicek_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    profiles:
      - production

networks:
  backend:
    driver: bridge
    name: jidelnicek_network

volumes:
  postgres_data:
    name: jidelnicek_postgres_data
  redis_data:
    name: jidelnicek_redis_data
  nginx_logs:
    name: jidelnicek_nginx_logs
  letsencrypt_data:
    name: jidelnicek_letsencrypt_data