# Nginx monitoring configuration
# Provides endpoints for monitoring and metrics collection

# Nginx status page (for monitoring tools like Prometheus nginx-exporter)
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    
    # Only allow local connections
    allow 127.0.0.1;
    allow ::1;
    allow 172.16.0.0/12;  # Docker networks
    deny all;
    
    # Nginx stub status
    location /nginx_status {
        stub_status on;
        access_log off;
    }
    
    # Basic health check
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
    
    # Detailed health check with headers
    location /health/detailed {
        access_log off;
        add_header Content-Type application/json;
        add_header X-Server-Name $hostname;
        add_header X-Server-Time $time_iso8601;
        return 200 '{"status":"healthy","server":"$hostname","time":"$time_iso8601","connections":{"active":"$connections_active","reading":"$connections_reading","writing":"$connections_writing","waiting":"$connections_waiting"}}\n';
    }
    
    # Metrics endpoint (basic)
    location /metrics {
        access_log off;
        add_header Content-Type text/plain;
        
        # Basic metrics in Prometheus format
        return 200 '# HELP nginx_up Nginx is up
# TYPE nginx_up gauge
nginx_up 1

# HELP nginx_connections_active Active connections
# TYPE nginx_connections_active gauge
nginx_connections_active $connections_active

# HELP nginx_connections_reading Reading connections
# TYPE nginx_connections_reading gauge
nginx_connections_reading $connections_reading

# HELP nginx_connections_writing Writing connections
# TYPE nginx_connections_writing gauge
nginx_connections_writing $connections_writing

# HELP nginx_connections_waiting Waiting connections
# TYPE nginx_connections_waiting gauge
nginx_connections_waiting $connections_waiting
';
    }
}