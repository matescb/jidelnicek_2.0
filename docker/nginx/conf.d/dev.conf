upstream jidelnicek_backend {
    server app:8000;
}

server {
    listen 80;
    server_name localhost;
    
    # Development settings
    client_max_body_size 50M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    
    # Main application
    location / {
        proxy_pass http://jidelnicek_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket support for hot reload
        proxy_set_header Connection "Upgrade";
        
        # Disable buffering for development
        proxy_buffering off;
    }
    
    # Static files
    location /static/ {
        alias /var/www/static/;
        expires off;  # No caching in development
    }
    
    # Media files
    location /media/ {
        alias /var/www/media/;
        expires off;  # No caching in development
    }
    
    # Health check
    location /health {
        access_log off;
        proxy_pass http://jidelnicek_backend/health;
    }
    
    # Development tools proxies
    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /redis-insight/ {
        proxy_pass http://redis-insight:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    location /mailhog/ {
        proxy_pass http://mailhog:8025/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket support for Mailhog
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}