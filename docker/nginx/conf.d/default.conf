# Upstream configuration for FastAPI backend
upstream jidelnicek_backend {
    server app:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;  # Maintain persistent connections
}

# Map for WebSocket upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Security
    server_tokens off;
    
    # Connection limits
    limit_conn addr 10;
    
    # Request size limits
    client_max_body_size 5M;  # Override global for this server
    client_body_buffer_size 128k;
    
    # Nginx healthcheck endpoint
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
    
    # API endpoints
    location /api/ {
        # Rate limiting based on endpoint
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        
        # CORS headers for API
        add_header 'Access-Control-Allow-Origin' $cors_header always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Max-Age' 3600 always;
        
        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        # Proxy settings
        proxy_pass http://jidelnicek_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Connection settings
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 16 4k;
        proxy_busy_buffers_size 8k;
        proxy_temp_file_write_size 64k;
    }
    
    # Auth endpoints with stricter rate limiting
    location ~ ^/api/auth/(login|register|reset-password) {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        
        # Same proxy config as API
        proxy_pass http://jidelnicek_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }
    
    # File upload endpoints with specific limits
    location ~ ^/api/(recipes|menus)/\d+/upload {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 5M;
        
        proxy_pass http://jidelnicek_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        # Disable buffering for uploads
        proxy_request_buffering off;
    }
    
    # WebSocket support for real-time features
    location /ws/ {
        proxy_pass http://jidelnicek_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # Static files with caching
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Serve pre-compressed files if available
        gzip_static on;
        
        # Disable access log for static files
        access_log off;
        
        # Security for static files
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # Media files (user uploads) with caching
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Security: Only allow specific file types
        location ~* \.(jpg|jpeg|png|gif|webp|pdf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
        
        # Deny access to other file types
        location ~* \.(php|php3|php4|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
        
        access_log off;
    }
    
    # Health check endpoint
    location = /health {
        access_log off;
        proxy_pass http://jidelnicek_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
    
    # API documentation / OpenAPI
    location /docs {
        proxy_pass http://jidelnicek_backend/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /redoc {
        proxy_pass http://jidelnicek_backend/redoc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /openapi.json {
        proxy_pass http://jidelnicek_backend/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Root location - future frontend or redirect to API docs
    location = / {
        # For now, redirect to API documentation
        return 302 /docs;
    }
    
    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        # Try to serve from static files first
        try_files /static/favicon.ico =404;
    }
    
    # Robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /admin/\nAllow: /\n";
    }
    
    # Security.txt
    location = /.well-known/security.txt {
        add_header Content-Type text/plain;
        return 200 "Contact: security@example.com\nPreferred-Languages: cs, en\n";
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}