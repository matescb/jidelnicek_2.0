user nginx;
worker_processes 1;
error_log /var/log/nginx/error.log debug;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Development logging with more details
    log_format dev '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time" '
                   'cs=$upstream_cache_status';

    access_log /var/log/nginx/access.log dev;

    # Basic settings
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;  # Larger for development

    # Minimal compression in dev
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # No security headers in development for easier debugging
    
    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}