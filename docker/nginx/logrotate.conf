# Nginx log rotation configuration for Jídelníček 2.0
# Place this file in /etc/logrotate.d/nginx on the host system

/var/lib/docker/volumes/jidelnicek_nginx_logs/_data/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 www-data adm
    sharedscripts
    prerotate
        if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
            run-parts /etc/logrotate.d/httpd-prerotate; \
        fi
    endscript
    postrotate
        # Send USR1 signal to Nginx to reopen log files
        docker exec jidelnicek_nginx nginx -s reopen 2>/dev/null || true
    endscript
}

