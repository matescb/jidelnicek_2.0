# PostgreSQL Configuration for Jídelníček 2.0 Production
# Optimized for VPS with 4GB RAM (1.5GB allocated to PostgreSQL)

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 200                   # Sized for app pool: 4 uvicorn workers × (pool_size=50 + max_overflow=20) + headroom
superuser_reserved_connections = 5      # Reserve connections for admin / psql sessions

# Memory Settings (Based on 1.5GB available)
shared_buffers = 384MB                  # 25% of available RAM
effective_cache_size = 1152MB           # 75% of available RAM
maintenance_work_mem = 96MB             # For VACUUM, CREATE INDEX
work_mem = 8MB                          # Per operation memory
wal_buffers = 16MB                      # Write-ahead log buffers

# Query Planner
random_page_cost = 1.1                  # SSD optimized
effective_io_concurrency = 200          # SSD optimized
default_statistics_target = 100         # Default statistics

# Write Performance
checkpoint_completion_target = 0.9      # Spread out checkpoint I/O
checkpoint_timeout = 10min              # Maximum time between checkpoints
max_wal_size = 1GB                      # Maximum WAL size before checkpoint
min_wal_size = 80MB                     # Minimum WAL size

# Logging
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
log_min_duration_statement = 1000       # Log queries slower than 1 second
log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_lock_waits = on
log_temp_files = 0

# Error reporting
log_min_messages = warning
log_min_error_statement = error

# Statement Behavior
statement_timeout = 30000               # 30 seconds
lock_timeout = 10000                    # 10 seconds
idle_in_transaction_session_timeout = 300000  # 5 minutes

# Autovacuum (Important for maintaining performance)
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# Client Connection Defaults
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.simple'

# Connection Pooling Settings (for use with pgBouncer)
# These are recommendations if using external pooler
# pool_mode = transaction
# default_pool_size = 25
# max_client_conn = 100

# Replication (if needed in future)
# wal_level = replica
# max_wal_senders = 3
# wal_keep_segments = 64
# hot_standby = on

# Archive (for backups)
# archive_mode = on
# archive_command = 'test ! -f /backup/archive/%f && cp %p /backup/archive/%f'

# SSL (recommended for production)
# ssl = on
# ssl_cert_file = 'server.crt'
# ssl_key_file = 'server.key'