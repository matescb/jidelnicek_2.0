# Redis Configuration for Jídelníček 2.0
# Production settings with security and performance optimizations

################################## NETWORK #####################################

# Accept connections only from the internal Docker network
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

################################# GENERAL #####################################

# Run as daemon
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 4

# Database purposes:
# db 0: Session storage
# db 1: Cache data
# db 2: Rate limiting
# db 3: Background job queues (future)

################################ SNAPSHOTTING ################################

# Save the DB on disk
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

################################# REPLICATION #################################

# Replication settings (for future scaling)
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

################################## SECURITY ###################################

# Password authentication is set via command line in docker-compose
# requirepass is set dynamically via --requirepass flag

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

################################### CLIENTS ####################################

# Set the max number of connected clients
maxclients 1000

############################## MEMORY MANAGEMENT ###############################

# Set memory limit to 512MB
maxmemory 512mb

# Eviction policy - remove least recently used keys
maxmemory-policy allkeys-lru

# Memory sampling
maxmemory-samples 5

# Replica ignores maxmemory
replica-ignore-maxmemory yes

############################# LAZY FREEING ####################################

lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

############################ KERNEL OOM CONTROL ##############################

oom-score-adj no

############################ KERNEL TRANSPARENT HUGEPAGE ######################

disable-thp yes

############################## APPEND ONLY MODE ###############################

# Enable AOF persistence
appendonly yes
appendfilename "appendonly.aof"

# Fsync policy
appendfsync everysec
no-appendfsync-on-rewrite no

# Auto rewrite configuration
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF
aof-load-truncated yes
aof-use-rdb-preamble yes

################################ LUA SCRIPTING ###############################

lua-time-limit 5000

################################## SLOW LOG ###################################

# Log queries slower than specified microseconds
slowlog-log-slower-than 10000
slowlog-max-len 128

################################ LATENCY MONITOR ##############################

latency-monitor-threshold 0

############################# EVENT NOTIFICATION ##############################

notify-keyspace-events ""

############################### ADVANCED CONFIG ###############################

hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol buffer limit
proto-max-bulk-len 512mb

# Frequency of rehashing the main dictionary
hz 10

# Enable dynamic HZ
dynamic-hz yes

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# RDB saves incremental fsync
rdb-save-incremental-fsync yes

# Enable active defragmentation
activedefrag no

# Jemalloc background thread for purging
jemalloc-bg-thread yes

# Health check settings
min-replicas-to-write 0
min-replicas-max-lag 10