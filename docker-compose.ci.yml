# Docker Compose configuration for CI/CD pipeline
# Used by GitLab CI for integration tests

version: '3.9'

services:
  # PostgreSQL for integration tests
  postgres:
    image: postgres:15-alpine
    container_name: jidelnicek_ci_db
    environment:
      POSTGRES_DB: test_jidelnicek
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_jidelnicek"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis for caching tests
  redis:
    image: redis:7-alpine
    container_name: jidelnicek_ci_redis
    command: redis-server --appendonly no --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # FastAPI Application for integration tests
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jidelnicek_ci_app
    environment:
      # Database
      DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_jidelnicek
      # Redis
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      # Application
      SECRET_KEY: test-secret-key-for-ci-integration-testing-32chars
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      # Environment
      ENVIRONMENT: test
      DEBUG: "false"
      TESTING: "true"
      # Test specific
      DB_PASSWORD: test_password
      SENTRY_DSN: https://test@sentry.io/123456
      CORS_ORIGINS: '["http://testserver"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

  # Celery worker for background task tests
  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jidelnicek_ci_celery
    command: celery -A jidelnicek.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_jidelnicek
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: test-secret-key-for-ci-integration-testing-32chars
      ENVIRONMENT: test
      DEBUG: "false"
      TESTING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  postgres_test_data:
    name: jidelnicek_ci_postgres_data

networks:
  default:
    name: jidelnicek_ci_network