# Development configuration without Redis authentication
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev-noauth.yml up

services:
  # Redis without authentication for easier development
  redis:
    command: redis-server /usr/local/etc/redis/redis.dev.conf
    environment:
      # No password needed
      REDIS_PASSWORD: ""
    volumes:
      - redis_data_dev:/data
      - ./docker/redis/redis.dev.conf:/usr/local/etc/redis/redis.dev.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Update app to connect to Redis without password
  app:
    environment:
      # Override Redis URL to connect without password
      REDIS_URL: redis://redis:6379/0
      REDIS_PASSWORD: ""