name: Translation Check

on:
  pull_request:
    paths:
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'frontend/src/i18n/locales/*.ts'
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/src/**/*.ts'
      - 'frontend/src/**/*.tsx'
      - 'frontend/src/i18n/locales/*.ts'

jobs:
  check-translations:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Extract translation keys
      working-directory: ./frontend
      run: npm run i18n:extract
    
    - name: Validate translations
      working-directory: ./frontend
      run: npm run i18n:validate
    
    - name: Check for missing translations
      working-directory: ./frontend
      run: |
        node -e "
        import('./src/i18n/management/index.js').then(async (m) => {
          const missing = await m.default.findMissingTranslations();
          if (missing.length > 0) {
            console.error('❌ Found', missing.length, 'missing translations');
            process.exit(1);
          } else {
            console.log('✅ No missing translations');
          }
        });
        "
    
    - name: Generate coverage report
      working-directory: ./frontend
      run: npm run i18n:coverage
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: translation-coverage
        path: |
          frontend/src/i18n/reports/coverage-report.md
          frontend/src/i18n/reports/coverage-report.json
    
    - name: Comment PR with coverage
      uses: actions/github-script@v6
      if: github.event_name == 'pull_request'
      with:
        script: |
          const fs = require('fs');
          const coverageReport = fs.readFileSync('./frontend/src/i18n/reports/coverage-report.md', 'utf8');
          
          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('# Translation Coverage Report')
          );
          
          const body = `${coverageReport}\n\n---\n*Updated by Translation Check workflow*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
          }