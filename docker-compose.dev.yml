# Development-specific overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # PostgreSQL Database (Development)
  db:
    environment:
      POSTGRES_DB: ${DB_NAME:-jidelnicek}
      POSTGRES_USER: ${DB_USER:-jidelnicek}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jidelnicek_dev_2024}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./docker/postgres/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./docker/postgres/01_dev_schema.sql:/docker-entrypoint-initdb.d/01_dev_schema.sql:ro
    ports:
      - "5432:5432"  # Expose PostgreSQL directly for development
    command: >
      postgres
      -c log_statement=all
      -c log_duration=on
      -c shared_preload_libraries='pg_stat_statements'

  # Redis Cache (Development)
  redis:
    command: redis-server /usr/local/etc/redis/redis.dev.conf
    environment:
      REDIS_PASSWORD: ""  # No password for development
    volumes:
      - redis_data_dev:/data
      - ./docker/redis/redis.dev.conf:/usr/local/etc/redis/redis.dev.conf:ro
    ports:
      - "6379:6379"  # Expose Redis directly for development
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # No password needed
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # FastAPI Application (Development)
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env.dev
    environment:
      # Override for development
      ENVIRONMENT: development
      DEBUG: "true"
      LOG_LEVEL: DEBUG
      # Database - use container name for host
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-jidelnicek}:${DB_PASSWORD:-jidelnicek_dev_2024}@db:5432/${DB_NAME:-jidelnicek}
      DB_HOST: db
      DB_PORT: 5432
      # Redis - use container name for host (no password for development)
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # Reload on code changes
      RELOAD: "true"
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./logs:/app/logs
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "8000:8000"  # Expose FastAPI directly for development
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Starting development server...' &&
        python -m uvicorn src.jidelnicek.main:app --host 0.0.0.0 --port 8000 --reload --log-level info
      "

  # Nginx (Optional for development)
  nginx:
    profiles:
      - with-nginx  # Only start if explicitly requested
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro

  # Mailhog for email testing (Development only)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jidelnicek_mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - backend
    logging:
      driver: "none"  # Disable logging for mailhog

  # pgAdmin for database management (Development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jidelnicek_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.localdomain
      PGADMIN_DEFAULT_PASSWORD: pgadmin_dev_2024
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    networks:
      - backend
    depends_on:
      - db
    profiles:
      - tools  # Only start if explicitly requested
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin

  # Redis Commander for Redis management (Development only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: jidelnicek_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379:0  # No password for development
    ports:
      - "8081:8081"
    networks:
      - backend
    depends_on:
      - redis
    profiles:
      - tools  # Only start if explicitly requested

volumes:
  postgres_data_dev:
    name: jidelnicek_postgres_data_dev
  redis_data_dev:
    name: jidelnicek_redis_data_dev
  pgadmin_data_dev:
    name: jidelnicek_pgadmin_data_dev