version: '3.9'

# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # PostgreSQL Database - Development
  db:
    ports:
      - "5432:5432"  # Expose PostgreSQL for development tools
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-development}
    volumes:
      - ./docker/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Redis Cache - Development
  redis:
    ports:
      - "6379:6379"  # Expose Redis for development tools
    command: redis-server --appendonly yes

  # FastAPI Application - Development
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder  # Use builder stage with all dev dependencies
    command: uvicorn jidelnicek.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      PYTHONDONTWRITEBYTECODE: 1
      LOG_LEVEL: DEBUG
      # Allow all CORS origins in development
      CORS_ORIGINS: "*"
      # Development database
      DATABASE_URL: postgresql://jidelnicek:development@db:5432/jidelnicek
    volumes:
      - ./src:/app/src:ro  # Mount source code for hot reload
      - ./tests:/app/tests:ro  # Mount tests
      - ./migrations:/app/migrations  # Mount migrations for development
      - ./logs:/app/logs
      - ./static:/app/static
      - ./media:/app/media
      - ./.env:/app/.env:ro  # Mount .env file
    ports:
      - "8000:8000"  # Expose FastAPI directly in development
    deploy:
      resources:
        limits:
          memory: 2048M  # More memory for development

  # Nginx - Development
  nginx:
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_TEMPLATE_SUFFIX: .conf
    ports:
      - "8080:80"  # Use different port to avoid conflicts

  # Additional development services
  
  # Adminer - Database management UI
  adminer:
    image: adminer:latest
    container_name: jidelnicek_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - backend
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark

  # RedisInsight - Redis management UI
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: jidelnicek_redis_insight
    restart: unless-stopped
    ports:
      - "8082:8001"
    networks:
      - backend
    depends_on:
      - redis
    volumes:
      - redis_insight_data:/db

  # Mailhog - Email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jidelnicek_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - backend

volumes:
  redis_insight_data:
    name: jidelnicek_redis_insight_data